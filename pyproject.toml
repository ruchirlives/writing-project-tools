[project]
name = "writing-project-tools"
version = "0.1.0"
description = "Reusable document generation and assertions review tools for writing projects."
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
generate-editable-table = "writing_project_tools.editable_table:main"
create-writing-docs = "writing_project_tools.create_docs:main"
edit-assertions = "writing_project_tools.assertions_editor:main"
scaffold-writing-project = "writing_project_tools.scaffold:main"
writing-project-mcp = "writing_project_tools.mcp_server:main"
export-writing-llm-context = "writing_project_tools.llm_context:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.template.md" = "writing_project_tools/AGENTS.template.md"
"src/writing_project_tools/templates/editable_table.html" = "writing_project_tools/templates/editable_table.html"

[tool.hatch.build.targets.sdist]
include = [
    "AGENTS.template.md",
    "README.md",
    "pyproject.toml",
    "src/",
    ".agents/skills/editable-evidence-table/",
    "scaffold_article.py",
    "docx_sources.csv",
]
